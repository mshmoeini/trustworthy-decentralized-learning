[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-decentralized-learning"
version = "0.1.0"
description = "Research framework for trustworthy decentralized learning experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.5",
    "torchvision>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
